<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>tentFit Konva 터치 스파이크</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #f4f1ea;
        font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      }
      body {
        touch-action: pan-x pan-y;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #root {
        height: 100dvh;
      }
      .stage-wrap {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      .overlay {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top));
        left: 8px;
        max-width: calc(100vw - 16px);
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(17, 24, 39, 0.82);
        color: #f9fafb;
        font-size: 12px;
        line-height: 1.45;
        touch-action: pan-x pan-y;
      }
      .overlay .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .overlay button {
        font-size: 13px;
        padding: 6px 9px;
        border: 0;
        border-radius: 6px;
        background: #e5e7eb;
        color: #111827;
      }
      .overlay button.on {
        background: #fbbf24;
      }
      .overlay input,
      .overlay select,
      .overlay textarea {
        font-size: 16px;
        user-select: text;
        -webkit-user-select: text;
      }
      .overlay input {
        width: 11em;
      }
      .overlay textarea {
        width: 100%;
        height: 8em;
      }
      .ok {
        color: #86efac;
      }
      .bad {
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
